name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'todaymenu/**'
      - '.github/workflows/deploy-pages.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: rm -f package-lock.json && npm install --registry https://registry.npmjs.org
        working-directory: todaymenu
      - name: Build
        run: npm run build
        working-directory: todaymenu
        env:
          VITE_API_BASE: https://menu-worker.hojjang18.workers.dev
      - name: Create Pages project (if not exists)
        run: npx wrangler pages project create ngv-menu --production-branch=main || true
        working-directory: todaymenu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=ngv-menu --branch=main
        working-directory: todaymenu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
